name: Verify web preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --ignore-scripts --no-audit playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - name: Package source and runtime for reproducible browser verification
        run: |
          mkdir -p preview-artifacts
          git archive --format=zip HEAD -o preview-artifacts/source.zip
          cp -R node_modules/three preview-artifacts/three
          cp -R dist preview-artifacts/dist
          cp -R browser-artifacts preview-artifacts/browser
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web-preview
          path: preview-artifacts/
          retention-days: 3
          if-no-files-found: error
