name: Prepare CC0 surfaces
on:
  push:
    paths:
      - scripts/fetch-surfaces.mjs
      - .github/workflows/materials.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-surfaces.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cc0-surfaces
          path: |
            public/world/surface-data.js
            docs/SURFACES.json
          retention-days: 7
          if-no-files-found: error
