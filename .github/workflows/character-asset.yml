name: Prepare rigged workshop character
on:
  push:
    branches: [fix/rigged-workshop-character]
    paths: [.github/workflows/character-asset.yml]
permissions:
  contents: read
jobs:
  asset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read original CC0 artist download references
        run: |
          mkdir -p character-asset
          python3 - <<'PY'
          import urllib.request,re,pathlib
          url='https://quaternius.com/packs/ultimatemodularcharacters.html'
          text=urllib.request.urlopen(url,timeout=30).read().decode()
          pathlib.Path('character-asset/artist.html').write_text(text)
          print('\n'.join(line for line in text.splitlines() if any(k in line.lower() for k in ['download','href=','drive.google','dropbox'])))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-character-source
          path: character-asset
          retention-days: 3
