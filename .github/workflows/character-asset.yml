name: Prepare rigged workshop character
on:
  push:
    branches: [fix/rigged-workshop-character]
    paths: [.github/workflows/character-asset.yml]
permissions:
  contents: read
jobs:
  asset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install gdown==5.2.0
      - name: Download CC0 rigged model from artist distribution
        run: |
          mkdir -p character-asset
          python3 - <<'PY'
          import gdown,pathlib,zipfile
          entries=gdown.download_folder('https://drive.google.com/drive/folders/1USAAquX2JJWuA2m6zol0KUkFe3UkZ8zX',skip_download=True,quiet=False)
          print(entries)
          for e in entries:
              if any(k in e.path.lower() for k in ['gltf','glb']):
                  f=gdown.download(id=e.id,output='character-asset/'+pathlib.Path(e.path).name,quiet=False)
                  print('downloaded',f)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-character-source
          path: character-asset
          retention-days: 3
